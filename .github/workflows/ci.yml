name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first — no point finishing a run
# whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The suite runs on SQLite. It used to require a live Postgres because the
      # FastAPI lifespan hook called create_all() against the production engine
      # before the test dependency override could take effect; that is fixed, and
      # this job exists partly to keep it fixed.
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  harness:
    name: Evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Tests the measuring instrument itself. If the scorer is wrong, every
      # number in the README is wrong and nothing else in the repo would say so.
      - name: Test the scorer
        run: python -m pytest evaluation/tests -q

      # The rule baseline needs no model, no API key and no GPU, so the headline
      # numbers are reproducible in CI. A regression in the AST engine shows up
      # here as a changed F1 rather than being discovered months later.
      - name: Reproduce the rules-only baseline
        run: |
          python -m evaluation.run_eval --systems rules-only --split test --force --no-score
          python -m evaluation.score --split test

      - name: Assert the baseline has not regressed
        run: |
          python - <<'PY'
          import json, sys
          metrics = json.load(open("evaluation/results/metrics.json"))
          rules = next(m for m in metrics if m["system"] == "rules-only")
          f1 = rules["f1"]["point"]
          clean = rules["clean_flag_rate"]["point"]
          print(f"rules-only F1={f1:.3f} clean_flag_rate={clean:.3f}")
          problems = []
          if f1 < 0.75:
              problems.append(f"F1 {f1:.3f} below floor 0.75")
          # Zero false alarms on the 120 control cases is the property most worth
          # protecting: it is what makes the tool usable, and it is easy to lose.
          if clean > 0.0:
              problems.append(f"clean-code flag rate {clean:.3f} above 0")
          if problems:
              sys.exit("regression: " + "; ".join(problems))
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run build` is tsc && vite build, so this catches type errors too.
      # It was broken by the React Query v4 -> v5 migration for some time.
      - name: Build
        working-directory: frontend
        run: npm run build
